<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        background: #07080d;
        color: #fff;
        font-family: 'Inter', system-ui, sans-serif;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 6% 7%;
      }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(37,99,235,0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(37,99,235,0.07) 1px, transparent 1px);
        background-size: 64px 64px;
      }
      .grid::after {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 70% at 30% 50%, transparent 25%, #07080d 100%);
      }
      .leak {
        position: absolute; top: -20%; right: -8%;
        width: 55%; height: 90%; border-radius: 50%;
        background: radial-gradient(circle, rgba(37,99,235,0.22) 0%, transparent 68%);
        filter: blur(40px);
      }
      .content { position: relative; z-index: 1; }
      .label {
        font-size: 1.4rem; font-weight: 600; letter-spacing: 0.16em;
        text-transform: uppercase; color: #5b8ef0; margin-bottom: 1.4rem;
      }
      .label b { font-family: 'JetBrains Mono', monospace; color: #2563eb; }
      h1 {
        font-size: 6.2rem; font-weight: 800; letter-spacing: -0.04em;
        line-height: 0.98;
      }
      h1 .accent { color: #5b8ef0; }
      .sub {
        margin-top: 1.6rem; font-size: 1.9rem; color: #8e95a9; max-width: 70%;
        line-height: 1.4;
      }
      .footer {
        position: absolute; left: 7%; bottom: 6%; z-index: 1;
        display: flex; align-items: center; gap: 1rem;
      }
      .mark {
        width: 64px; height: 64px; border-radius: 14px; background: #2563eb;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.5rem; font-weight: 800; letter-spacing: 0.04em;
      }
      .name { font-size: 1.5rem; font-weight: 600; }
      .name span { display: block; color: #8e95a9; font-size: 1.1rem; font-weight: 400; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="leak"></div>
    <div class="content">
      <p class="label"><b>//</b> Frontend Engineer</p>
      <h1>I craft interfaces<br /><span class="accent">that feel alive.</span></h1>
      <p class="sub">Design systems, motion, and pixel-perfect, accessible UI.</p>
    </div>
    <div class="footer">
      <div class="mark">MA</div>
      <div class="name">Martin Atanasov<span>martin-atanasov.netlify.app</span></div>
    </div>
  </body>
</html>
