<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07080D" />
    <title>404 — Page not found · Martin Atanasov</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563EB'/><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' fill='white' font-size='18' font-family='system-ui' font-weight='700'>M</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #07080d;
        --text-1: #ffffff;
        --text-2: #8e95a9;
        --accent: #2563eb;
        --accent-light: #5b8ef0;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text-1);
        font-family: 'Inter', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        overflow: hidden;
        position: relative;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(37, 99, 235, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(37, 99, 235, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }
      .grid::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 30%, var(--bg) 100%);
      }
      .content { position: relative; z-index: 1; }
      .code {
        font-size: clamp(5rem, 22vw, 11rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        background: linear-gradient(135deg, var(--text-1), var(--accent-light));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .label {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent-light);
        margin-bottom: 0.75rem;
      }
      .label b { font-family: monospace; color: var(--accent); }
      h1 {
        font-size: clamp(1.4rem, 4vw, 2rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 1rem 0 0.75rem;
      }
      p { color: var(--text-2); max-width: 28rem; margin: 0 auto 2rem; line-height: 1.6; }
      a.home {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.8rem 1.6rem;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        border-radius: 9999px;
        transition: background 0.2s ease, transform 0.2s ease;
      }
      a.home:hover { background: var(--accent-light); transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="content">
      <p class="label"><b>//</b> Lost in space</p>
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a class="home" href="/">
        Back to home
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  </body>
</html>
